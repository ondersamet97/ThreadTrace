<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThreadTrace</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 18px; width: 350px; max-width: 100vw; color: #111111; background: #f7f7f7; overflow-wrap: anywhere; }
      h1 { font-size: 20px; margin: 0 0 6px; letter-spacing: -.01em; }
      p.note, .meta { font-size: 12px; line-height: 1.6; color: #666666; }
      ul { list-style: none; padding: 0; margin-top: 20px; }
      li { padding: 16px; border: 1px solid #dedede; border-radius: 16px; background: #ffffff; margin-bottom: 12px; }
      li a { color: inherit; font-size: 15px; font-weight: 650; line-height: 1.5; text-decoration: none; }
      li a:hover { text-decoration: underline; }
      .meta { margin-top: 8px; }
      a:focus-visible { outline: 2px solid #111111; outline-offset: 3px; }
      @media (prefers-color-scheme: dark) {
        body { color: #f5f5f5; background: #101010; }
        li { background: #181818; border-color: #303030; }
        p.note, .meta { color: #b3b3b3; }
        a:focus-visible { outline-color: #f5f5f5; }
      }
    </style>
  </head>
  <body>
    <h1>Kişisel hafıza (yerel)</h1>
    <p class="note">Bu liste yalnız bu tarayıcıda saklanır. Threads'in yerleşik Saved listesiyle senkronize değildir.</p>
    <ul id="saved-list"></ul>
    <p id="empty" class="note">Henüz kaydedilmiş gönderi yok.</p>
    <script src="i18n.js"></script>
    <script src="page-language.js"></script>
    <script src="client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
